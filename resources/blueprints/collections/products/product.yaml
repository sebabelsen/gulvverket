title: Produkt
tabs:
  main:
    display: Hovedinnhold
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Produktnavn
              localizable: true
              validate:
                - required
          -
            handle: short_description
            field:
              type: textarea
              display: 'Kort beskrivelse'
              instructions: 'Vises på produktkort og i søkeresultater. Maks ~160 tegn anbefalt.'
              character_limit: 200
              localizable: true
          -
            handle: description
            field:
              type: bard
              display: Beskrivelse
              localizable: true
              container: assets
              buttons:
                - bold
                - italic
                - underline
                - h2
                - h3
                - unorderedlist
                - orderedlist
                - quote
                - link
                - image
                - table
          -
            handle: gallery
            field:
              type: assets
              display: Produktbilder
              container: assets
              instructions: 'Første bilde brukes som hovedbilde på produktkort og i header.'
          -
            handle: recommended
            field:
              type: toggle
              display: Anbefalt
              instructions: 'Vis et badge på produktet som signaliserer at HGS bruker det i daglig arbeid.'
              localizable: true
  inventory:
    display: Lager
    sections:
      -
        fields:
          -
            handle: stock
            field:
              type: integer
              display: 'Antall på lager'
              instructions: 'La stå tom for å hoppe over lagerstyring. Cargo trekker fra automatisk ved bestillinger.'
  organization:
    display: Organisering
    sections:
      -
        fields:
          -
            handle: category
            field:
              type: terms
              display: Kategori
              taxonomies:
                - categories
              max_items: 1
              mode: select
              create: false
          -
            handle: related_products
            field:
              type: entries
              display: 'Relaterte produkter'
              collections:
                - products
              max_items: 4
              mode: select
              instructions: 'Vises som "Se også" nederst på produktsiden.'
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: seo_title
            field:
              type: text
              display: SEO-tittel
              instructions: 'Overstyrer produktnavn i <title>-taggen.'
              localizable: true
          -
            handle: seo_description
            field:
              type: textarea
              display: Meta-beskrivelse
              character_limit: 160
              localizable: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: categories
            field:
              type: terms
              taxonomies:
                - categories
              display: Kategorier
              mode: select
          -
            handle: price
            field:
              type: money
              display: Price
              instructions: 'Enter the price of the product, inclusive of tax.'
              listable: hidden
              validate: required
          -
            handle: tax_class
            field:
              type: tax_classes
              display: 'Tax Class'
              instructions: 'Determines how this product is taxed.'
              listable: hidden
              max_items: 1
              create: true
              validate: required
              default: general
              mode: select
