title: Spørsmål
tabs:
  main:
    display: Hovedinnhold
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Spørsmål
              localizable: true
              instructions: 'Selve spørsmålet. Brukes som tittel og overskrift.'
              validate:
                - required
          -
            handle: answer
            field:
              type: bard
              display: Svar
              localizable: true
              container: assets
              buttons:
                - bold
                - italic
                - link
                - unorderedlist
                - orderedlist
              validate:
                - required
              placeholder: 'Legg inn svar'
              remove_empty_nodes: false
          -
            handle: faq_group
            field:
              type: select
              display: Gruppe
              instructions: 'Brukes for å gruppere spørsmål på FAQ-siden.'
              options:
                generelt: Generelt
                bestilling: Bestilling
                betaling: 'Betaling og faktura'
                frakt: 'Frakt og levering'
                produkter: Produkter
                vedlikehold: Vedlikehold
              default: generelt
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
