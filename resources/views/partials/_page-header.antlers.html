<header class="page-header">
    <h1 class="page-title">{{ title }}</h1>
    {{ if lead }}
        <p class="page-lead">{{ lead }}</p>
    {{ /if }}
</header>

{{ if featured_image }}
    {{ featured_image }}
        <div class="page-hero">
            <img src="{{ url }}" alt="{{ alt ?? title }}">
        </div>
    {{ /featured_image }}
{{ /if }}
