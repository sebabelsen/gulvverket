<a href="{{ url }}" class="group block">
    {{ if featured_image }}
        {{ featured_image }}
            <div class="aspect-[16/10] bg-stone-100 rounded-xl overflow-hidden mb-4">
                <img src="{{ url }}" alt="{{ alt ?? title }}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            </div>
        {{ /featured_image }}
    {{ else }}
        <div class="aspect-[16/10] bg-stone-100 rounded-xl mb-4 flex items-center justify-center text-stone-400 text-sm">
            Ingen bilde
        </div>
    {{ /if }}

    {{ if article_tags }}
        <div class="flex flex-wrap gap-2 mb-2">
            {{ article_tags limit="2" }}
                <span class="text-xs uppercase tracking-wide text-stone-500">{{ title }}</span>
            {{ /article_tags }}
        </div>
    {{ /if }}

    <h2 class="text-xl font-semibold text-stone-950 group-hover:underline mb-2">{{ title }}</h2>

    {{ if lead }}
        <p class="text-stone-600 line-clamp-3">{{ lead }}</p>
    {{ /if }}

    <p class="mt-3 text-xs text-stone-500">{{ date format="j. F Y" }}</p>
</a>
