<!doctype html>
<html lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ seo_title ?? title }}{{ unless title == site:name }} — {{ site:name }}{{ /unless }}</title>
        {{ if seo_description }}
            <meta name="description" content="{{ seo_description }}">
        {{ elseif lead }}
            <meta name="description" content="{{ lead }}">
        {{ /if }}

        {{# Fonts #}}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

        {{ vite src="resources/js/site.js|resources/css/site.css|resources/scss/site.scss" }}
    </head>
    <body class="theme-light">

    {{ partial:nav }}
        <main>
            {{ template_content }}
        </main>
    {{ partial:footer }}

    </body>
</html>
