<!doctype html>
<html lang="{{ site:short_locale }}">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>{{ seo_title ?? title }}{{ unless title == site:name }} — {{ site:name }}{{ /unless }}</title>
    {{ if seo_description }}
    <meta name="description" content="{{ seo_description }}">
    {{ elseif lead }}
    <meta name="description" content="{{ lead }}">
    {{ /if }}

    {{# Fonts — Fraunces (display serif) + Hanken Grotesk (body/UI) #}}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    {{ vite src="resources/js/site.js|resources/css/site.css|resources/scss/site.scss" }}
</head>

<body>

    {{ partial:nav }}
    <main>
        {{ template_content }}
    </main>
    {{ partial:footer }}

</body>

</html>
