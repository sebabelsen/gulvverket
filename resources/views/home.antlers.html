<section class="max-w-6xl mx-auto px-4 py-16">
    <div class="max-w-2xl">
        <h1 class="text-4xl md:text-5xl font-semibold tracking-tight text-stone-950 mb-4">Produkter og fagkunnskap for gulv</h1>
        <div class="prose prose-stone max-w-none mb-8">
            {{ content }}
        </div>
        <a href="/produkter" class="inline-flex items-center gap-2 px-5 py-3 bg-stone-900 text-white rounded-lg font-medium hover:bg-stone-800 transition">
            Se produkter
            <span aria-hidden="true">→</span>
        </a>
    </div>
</section>

<section class="max-w-6xl mx-auto px-4 py-12 border-t border-stone-200">
    <h2 class="text-2xl font-semibold text-stone-950 mb-8">Utvalgte produkter</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{ collection from="products" limit="3" }}
            {{ partial:product-card }}
        {{ /collection }}
    </div>
</section>
