<section class="blog-index">

    <header class="blog-header">
        <h1 class="blog-title">Nyheter</h1>
    </header>

    {{# Tag filter pills #}}
    {{#<nav class="pill-nav">
        <a href="/blogg" class="pill is-active">Alle</a>
        {{ taxonomy:article_tags }}
        <a href="{{ url }}" class="pill">{{ title }}</a>
        {{ /taxonomy:article_tags }}
    </nav>#}}

    <div class="blog-grid">

        {{ collection from="articles" sort="date:desc" }}
        {{ partial:article-card }}
        {{ /collection }}

        {{ if no_results }}
        <p class="blog-empty">Ingen artikler ennå.</p>
        {{ /if }}

    </div>

</section>
