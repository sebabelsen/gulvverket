<section class="max-w-5xl mx-auto px-4 py-12">

    <header class="mb-12 max-w-2xl">
        <h1 class="text-3xl md:text-4xl font-semibold tracking-tight text-stone-950 mb-3">Nyheter</h1>
    </header>

    {{# Tag filter pills #}}
    {{#<nav class="flex flex-wrap gap-2 mb-10">
        <a href="/blogg" class="px-4 py-1.5 text-sm bg-stone-900 text-white rounded-full">Alle</a>
        {{ taxonomy:article_tags }}
            <a href="{{ url }}" class="px-4 py-1.5 text-sm bg-white border border-stone-300 text-stone-700 rounded-full hover:border-stone-500 transition">{{ title }}</a>
        {{ /taxonomy:article_tags }}
    </nav>#}}

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

        {{ collection from="articles" sort="date:desc" }}

        {{ /collection }}

        {{ if no_results }}
            <p class="col-span-full text-stone-500 italic py-8 text-center">Ingen artikler ennå.</p>
        {{ /if }}

    </div>

</section>
