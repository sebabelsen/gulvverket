<section class="page page--wide">

    <header class="page-header">
        <h1 class="page-title">Produkter</h1>
    </header>

    <div class="product-grid">
        {{ collection from="products" }}
            {{ partial:product-card }}
        {{ /collection }}

        {{ if no_results }}
        <p class="product-empty">Ingen produkter ennå.</p>
        {{ /if }}
    </div>

</section>
