    </header>

    <div class="product-grid" data-product-grid>
        {{ collection from="products" }}
        <div class="product-cell" data-cats="{{ category }}{{ slug }} {{ /category }}">

        {{ if no_results }}

        {{ /if }}
    </div>

</section>
